<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDG 経営ダッシュボード v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ── リセット・ベース ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #e4e9f2;
      --bg-card:   #ffffff;
      --border:    #ccd4e4;
      --navy:      #0d1a3a;
      --accent:    #3452d9;
      --brand:     #0090BA;
      --ink:       #1a1a2e;
      --ink-mid:   #4a5568;
      --ink-faint: #718096;
      --red:       #c23b3b;
      --green:     #1c8a53;
      --font-ja:   'Zen Kaku Gothic New', 'Hiragino Sans', 'ヒラギノ角ゴシック', sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }
    html, body { height: 100%; background: var(--bg); font-family: var(--font-ja); font-size: 14px; color: var(--ink); }

    /* ── ヘッダー ── */
    .app-header {
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-logo-badge {
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.08em;
      padding: 4px 11px;
      border-radius: 6px;
    }
    .app-title { font-size: 13px; color: rgba(255,255,255,.75); }
    .app-badge {
      margin-left: auto;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.75);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.04em;
    }

    /* ── ナビゲーション ── */
    .app-nav {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0;
      padding: 0 16px;
      overflow-x: auto;
    }
    .nav-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font-ja);
      color: var(--ink-faint);
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .nav-btn:hover { color: var(--accent); }
    .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── 画面切り替え ── */
    .screen { display: none; padding: 24px; max-width: 1280px; margin: 0 auto; }
    .screen.active { display: block; }

    /* ── ヒーローKPI（グループ全体・濃紺背景） ── */
    .hero-kpis {
      background: var(--navy);
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .hero-kpi {
      padding: 22px 28px;
      color: #fff;
      border-right: 1px solid rgba(255,255,255,.1);
    }
    .hero-kpi:last-child { border-right: none; }
    .hero-kpi-label { font-size: 11px; color: rgba(255,255,255,.6); font-weight: 600; margin-bottom: 8px; letter-spacing: .04em; }
    .hero-kpi-value { font-size: 26px; font-weight: 900; font-family: var(--font-mono); color: #fff; }
    .hero-kpi-value.negative { color: #ff8080; }

    /* ── 4社カード ── */
    .company-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .company-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .company-card-header {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .company-name { font-size: 13px; font-weight: 800; color: #fff; }
    .company-period { font-size: 10px; color: rgba(255,255,255,.75); display: flex; align-items: center; gap: 4px; }
    .company-card-body { padding: 14px 16px; }
    .company-metrics { display: flex; flex-direction: column; }
    .metric { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .metric:last-child { border-bottom: none; }
    .metric-label { font-size: 11px; color: var(--ink-faint); }
    .metric-value { font-size: 14px; font-weight: 700; font-family: var(--font-mono); }
    .metric-value.negative { color: var(--red); }
    .company-diffs { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--border); padding-top: 10px; }
    .diff-item { display: flex; justify-content: space-between; font-size: 11px; }
    .diff-label { color: var(--ink-faint); }
    .diff-value { font-family: var(--font-mono); font-weight: 600; color: var(--ink-mid); }

    /* ── くわしく見るナビカード ── */
    .nav-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-faint); margin-bottom: 10px; }
    .nav-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .nav-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .nav-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .nav-card-icon { font-size: 20px; margin-bottom: 2px; }
    .nav-card-title { font-size: 13px; font-weight: 700; color: var(--ink); }
    .nav-card-sub { font-size: 11px; color: var(--ink-faint); }
    .nav-card.disabled { opacity: .5; cursor: default; }
    .nav-card.disabled:hover { border-color: var(--border); transform: none; }

    /* ── バッジ ── */
    .badge-wip {
      display: inline-block;
      background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
      border-radius: 10px; font-size: 10px; font-weight: 700;
      padding: 1px 7px; margin-left: 6px; vertical-align: middle;
    }
    .badge-sample {
      display: inline-block;
      background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe;
      border-radius: 10px; font-size: 10px; font-weight: 700;
      padding: 1px 7px; margin-left: 6px; vertical-align: middle;
    }
    .badge-kakutei {
      display: inline-block; padding: 2px 8px;
      background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7;
      border-radius: 10px; font-size: 10px; font-weight: 700; vertical-align: middle;
    }
    .badge-sokuho {
      display: inline-block; padding: 2px 8px;
      background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
      border-radius: 10px; font-size: 10px; font-weight: 700; vertical-align: middle;
    }
    .grayed-out { opacity: .45; pointer-events: none; }

    /* ── 事業構造マップ ── */
    .biz-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .biz-tab {
      padding: 5px 14px; border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 12px; font-weight: 700; font-family: var(--font-ja);
      cursor: pointer; background: var(--bg-card); color: var(--ink-mid);
      transition: background .1s, color .1s, border-color .1s;
    }
    .biz-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .biz-tab.disabled { opacity: .5; cursor: default; }
    .biz-period-selector { display: flex; gap: 6px; margin-bottom: 16px; }
    .period-btn {
      padding: 5px 16px; border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 12px; font-weight: 600; font-family: var(--font-ja);
      cursor: pointer; background: var(--bg-card); color: var(--ink-mid);
      transition: background .1s, color .1s;
    }
    .period-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .biz-note { font-size: 10px; color: var(--ink-faint); font-style: italic; margin-bottom: 14px; line-height: 1.6; }
    .biz-note-sub { color: #0369a1; font-style: normal; font-size: 10px; }
    .biz-layout { display: grid; grid-template-columns: 230px 1fr; gap: 16px; }
    .biz-left { display: flex; flex-direction: column; gap: 8px; }
    .biz-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .biz-tile:hover { border-color: var(--accent); }
    .biz-tile.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(52,82,217,.12); }
    .biz-tile-name { font-size: 12px; font-weight: 800; margin-bottom: 6px; }
    .biz-tile-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-mid); padding: 2px 0; }
    .biz-tile-row span:last-child { font-family: var(--font-mono); font-weight: 600; }
    .biz-tile-note { font-size: 10px; color: var(--ink-faint); margin-top: 4px; }
    .biz-share-bar-wrap { margin-top: 8px; background: #eef2f8; border-radius: 3px; height: 4px; }
    .biz-share-bar { height: 4px; border-radius: 3px; min-width: 2px; }
    .biz-share-pct { font-size: 10px; color: var(--ink-faint); margin-top: 3px; }
    .biz-right {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      min-height: 300px;
    }
    .biz-hint { padding: 60px 20px; text-align: center; color: var(--ink-faint); font-size: 13px; }

    /* ── 詳細テーブル共通 ── */
    .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detail-table th {
      text-align: left; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--ink-faint); border-bottom: 2px solid var(--border); padding: 6px 8px;
    }
    .detail-table th.td-right { text-align: right; }
    .detail-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
    .td-right { text-align: right !important; font-family: var(--font-mono); }
    .acc-trigger { cursor: pointer; }
    .acc-trigger:hover td { background: #f5f8ff; }
    .acc-td { }
    .acc-icon { width: 20px; text-align: center; font-size: 10px; color: var(--ink-faint); }
    .acc-body { display: none; }
    .acc-body.open { display: table-row-group; }
    .by-item-list { list-style: none; padding: 4px 0 4px 24px; }
    .by-item-list li { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; color: var(--ink-mid); border-bottom: 1px solid var(--border); }
    .by-item-list li:last-child { border-bottom: none; }
    .by-item-list li span:last-child { font-family: var(--font-mono); }
    .total-row td { font-weight: 700; background: #f1f5f9; }
    .biz-detail-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
    .detail-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 14px 0 6px; }
    .gp-summary { margin-top: 14px; padding: 10px 14px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; font-size: 13px; }
    .gp-summary strong { font-family: var(--font-mono); }
    .negative { color: var(--red) !important; }
    .positive { color: var(--green) !important; }

    /* ── 予実管理 ── */
    .budget-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .budget-header { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .budget-period-label { font-size: 13px; font-weight: 700; color: var(--ink-mid); display: flex; align-items: center; gap: 6px; }
    .budget-section { margin-bottom: 28px; }
    .budget-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); margin-bottom: 8px; }
    .budget-table { }
    .budget-row { }

    /* ── 品目別予算テーブル ── */
    .by-item-budget-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 4px 0; }
    .by-item-budget-table th { text-align: right; padding: 3px 8px; font-size: 10px; color: var(--ink-faint); font-weight: 700; }
    .by-item-budget-table th:first-child { text-align: left; padding-left: 20px; }
    .by-item-budget-table td { padding: 4px 8px; border-top: 1px solid var(--border); text-align: right; color: var(--ink-mid); font-family: var(--font-mono); }
    .by-item-budget-table td:first-child { text-align: left; padding-left: 20px; font-family: var(--font-ja); }

    /* ── 経営目標画面 ── */
    .goals-screen { }
    .goals-screen-title { font-size: 18px; font-weight: 900; margin-bottom: 12px; }
    .goals-sample-badge { display: inline-block; background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 3px 10px; margin-bottom: 16px; }
    .goals-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .goals-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .goals-card-label { font-size: 11px; color: var(--ink-faint); margin-bottom: 6px; }
    .goals-card-target { font-size: 22px; font-weight: 900; font-family: var(--font-mono); color: var(--ink); margin-bottom: 10px; }
    .goals-card-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--border); }
    .goals-unlinked { color: var(--ink-faint); }
    .goals-note { margin-top: 20px; font-size: 12px; color: var(--ink-faint); }
    .goals-placeholder { text-align: center; padding: 40px; }
    .goals-placeholder-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--ink-mid); }
    .goals-placeholder-body { font-size: 13px; color: var(--ink-faint); }

    /* ── 年度比較画面 ── */
    .trend-screen { }
    .trend-title { font-size: 18px; font-weight: 900; margin-bottom: 12px; }
    .trend-placeholder { color: var(--ink-faint); font-size: 13px; margin-bottom: 20px; }
    .trend-sample-badge { display: inline-block; background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 3px 10px; margin-bottom: 12px; }

    /* ── エラー ── */
    .error-msg { color: var(--red); font-size: 13px; padding: 40px; text-align: center; }

    /* ── レスポンシブ ── */
    @media (max-width: 900px) {
      .hero-kpis { grid-template-columns: 1fr; }
      .company-cards { grid-template-columns: repeat(2, 1fr); }
      .biz-layout { grid-template-columns: 1fr; }
      .goals-cards { grid-template-columns: 1fr; }
      .nav-cards { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header class="app-header">
  <span class="app-logo-badge">BDG</span>
  <span class="app-title">BLUE DESIGN GROUP 経営ダッシュボード</span>
  <span class="app-badge">v2 BETA</span>
</header>

<nav class="app-nav">
  <button class="nav-btn active" data-screen="s-top">経営TOP</button>
  <button class="nav-btn" data-screen="s-biz">事業構造マップ</button>
  <button class="nav-btn" data-screen="s-budget">予実管理</button>
  <button class="nav-btn" data-screen="s-goals">経営目標<span class="badge-sample">サンプル</span></button>
  <button class="nav-btn" data-screen="s-trend">年度比較<span class="badge-sample">サンプル</span></button>
</nav>

<main>
  <div id="s-top"    class="screen active"></div>
  <div id="s-biz"    class="screen"></div>
  <div id="s-budget" class="screen"></div>
  <div id="s-goals"  class="screen"></div>
  <div id="s-trend"  class="screen"></div>
</main>

<script src="script.js"></script>
</body>
</html>
