<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDG 経営ダッシュボード v2</title>
  <style>
    /* ── リセット・ベース ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:   #0090BA;
      --brand-dk:#006d8f;
      --black:   #000000;
      --ink:     #1a1a2e;
      --ink-mid: #444;
      --ink-faint:#888;
      --bg:      #f5f7fa;
      --bg-card: #ffffff;
      --border:  #e2e8f0;
      --red:     #dc2626;
      --green:   #059669;
      --font-ja: 'Hiragino Sans', 'ヒラギノ角ゴシック', '游ゴシック', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); font-family: var(--font-ja); font-size: 14px; color: var(--ink); }

    /* ── ヘッダー ── */
    .app-header {
      background: var(--black);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-logo { font-weight: 800; font-size: 18px; letter-spacing: 0.08em; color: var(--brand); }
    .app-title { font-size: 13px; color: #ccc; }
    .app-badge {
      margin-left: 8px;
      background: var(--brand);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      letter-spacing: 0.04em;
    }

    /* ── ナビゲーション ── */
    .app-nav {
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0;
      padding: 0 16px;
      overflow-x: auto;
    }
    .nav-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-faint);
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .nav-btn:hover { color: var(--brand); }
    .nav-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* ── 画面切り替え ── */
    .screen { display: none; padding: 24px; max-width: 1280px; margin: 0 auto; }
    .screen.active { display: block; }

    /* ── セクション見出し ── */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-faint);
      margin-bottom: 12px;
      margin-top: 28px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ── ヒーローKPI（経営TOP） ── */
    .hero-kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .hero-kpi {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    .hero-kpi-label { font-size: 11px; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; }
    .hero-kpi-value { font-size: 28px; font-weight: 800; color: var(--brand-dk); }
    .hero-kpi-value.negative { color: var(--red); }

    /* ── 4社カード ── */
    .company-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .company-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .company-card-header {
      padding: 12px 16px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }
    .company-card-period { font-size: 10px; opacity: .75; font-weight: 400; margin-top: 2px; }
    .company-card-body { padding: 14px 16px; }
    .company-kpi { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .company-kpi:last-child { border-bottom: none; }
    .company-kpi-label { font-size: 11px; color: var(--ink-faint); }
    .company-kpi-value { font-size: 14px; font-weight: 700; }
    .company-kpi-value.negative { color: var(--red); }
    .company-diffs { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .diff-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-mid); }
    .diff-row .diff-val { font-weight: 700; }
    .diff-row .diff-val.pos { color: var(--green); }
    .diff-row .diff-val.neg { color: var(--red); }

    /* ── 目標プレースホルダー ── */
    .placeholder-card {
      background: #f8f9fb;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--ink-faint);
    }
    .placeholder-card .ph-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: var(--ink-mid); }
    .placeholder-card .ph-sub { font-size: 12px; }
    .badge-wip {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-sample {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .grayed-out { opacity: .45; pointer-events: none; }

    /* ── 事業構造マップ ── */
    .biz-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .period-pills { display: flex; gap: 6px; }
    .period-pill {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-mid);
      cursor: pointer;
      transition: background .1s, color .1s;
    }
    .period-pill.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .biz-note { font-size: 10px; color: var(--ink-faint); font-style: italic; }
    .biz-company-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .biz-co-tab {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .1s;
    }
    .biz-co-tab.active { border-color: currentColor; }
    .biz-co-tab.wip { opacity: .5; cursor: default; }
    .biz-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
    }
    .biz-tiles { display: flex; flex-direction: column; gap: 10px; }
    .biz-tile {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .biz-tile:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .biz-tile.selected { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,144,186,.15); }
    .biz-tile-name { font-size: 13px; font-weight: 800; margin-bottom: 6px; }
    .biz-tile-rev { font-size: 18px; font-weight: 700; color: var(--ink); }
    .biz-tile-gp { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
    .biz-detail {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      min-height: 300px;
    }
    .biz-detail-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--brand-dk); }

    /* ── 詳細テーブル共通 ── */
    .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detail-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
      border-bottom: 2px solid var(--border);
      padding: 6px 8px;
    }
    .detail-table th.td-right { text-align: right; }
    .detail-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
    .detail-table td.td-right { text-align: right; font-variant-numeric: tabular-nums; }
    .detail-table tr.acct-row { cursor: pointer; }
    .detail-table tr.acct-row:hover td { background: #f0f9ff; }
    .detail-table tr.acct-row td:first-child::before { content: '›'; margin-right: 4px; color: var(--ink-faint); }
    .detail-table tr.acct-row.open td:first-child::before { content: '⌄'; }
    .detail-table tr.subtotal-row td { font-weight: 700; background: #f8fafc; font-size: 13px; }
    .detail-table tr.section-row td { background: #eef2ff; font-weight: 700; font-size: 11px; color: #3730a3; text-transform: uppercase; letter-spacing: .06em; }
    .negative { color: var(--red) !important; }
    .positive { color: var(--green) !important; }

    /* ── by_itemアコーディオン ── */
    .acc-body { display: none; }
    .acc-body.open { display: table-row-group; }
    .by-item-list td { background: #f8fafc !important; padding-left: 32px !important; font-size: 11px; color: var(--ink-mid); }

    /* ── 予実管理テーブル ── */
    .budget-table-wrap { overflow-x: auto; }
    .budget-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px; }
    .budget-table th {
      text-align: right;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-faint);
      border-bottom: 2px solid var(--border);
      padding: 6px 10px;
    }
    .budget-table th:first-child { text-align: left; }
    .budget-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
    .budget-table td:first-child { text-align: left; }
    .budget-table tr.sect-row td { background: #f1f5f9; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #475569; }
    .budget-table tr.acct-row { cursor: pointer; }
    .budget-table tr.acct-row:hover td { background: #f0f9ff; }
    .budget-table tr.acct-row td:first-child::before { content: '›'; margin-right: 4px; color: var(--ink-faint); }
    .budget-table tr.acct-row.open td:first-child::before { content: '⌄'; }
    .budget-table tr.item-row td { background: #f8fafc; font-size: 11px; color: var(--ink-mid); }
    .budget-table tr.item-row td:first-child { padding-left: 28px; }
    .budget-table tr.total-row td { font-weight: 700; background: #eef2ff; font-size: 13px; }
    .ach-good  { color: var(--green); font-weight: 700; }
    .ach-bad   { color: var(--red);   font-weight: 700; }
    .ach-ok    { color: #92400e;      font-weight: 700; }

    /* ── 経営目標画面 ── */
    .goals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .goal-name { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
    .goal-target { font-size: 20px; font-weight: 800; color: var(--ink); }
    .goal-current { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
    .goal-bar-wrap { margin-top: 10px; background: var(--border); border-radius: 4px; height: 6px; }
    .goal-bar { height: 6px; border-radius: 4px; background: var(--brand); }

    /* ── 年度比較画面 ── */
    .trend-placeholder { margin-top: 24px; }

    /* ── エラー ── */
    .error-msg { color: var(--red); font-size: 13px; padding: 40px; text-align: center; }

    /* ── レスポンシブ ── */
    @media (max-width: 900px) {
      .hero-kpis { grid-template-columns: 1fr; }
      .company-cards { grid-template-columns: repeat(2, 1fr); }
      .biz-layout { grid-template-columns: 1fr; }
      .goals-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <span class="app-logo">BDG</span>
  <span class="app-title">BLUE DESIGN GROUP 経営ダッシュボード</span>
  <span class="app-badge">v2 BETA</span>
</header>

<nav class="app-nav">
  <button class="nav-btn active" data-screen="s-top">経営TOP</button>
  <button class="nav-btn" data-screen="s-biz">事業構造マップ</button>
  <button class="nav-btn" data-screen="s-budget">予実管理</button>
  <button class="nav-btn" data-screen="s-goals">経営目標<span class="badge-sample">サンプル</span></button>
  <button class="nav-btn" data-screen="s-trend">年度比較<span class="badge-sample">サンプル</span></button>
</nav>

<main>
  <div id="s-top"    class="screen active"></div>
  <div id="s-biz"    class="screen"></div>
  <div id="s-budget" class="screen"></div>
  <div id="s-goals"  class="screen"></div>
  <div id="s-trend"  class="screen"></div>
</main>

<script src="script.js"></script>
</body>
</html>
